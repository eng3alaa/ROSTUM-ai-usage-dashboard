name: tests

# Runs the headless suite (tests/run.mjs) against the real page in the runner's preinstalled Chrome.
# windows-latest tests core.autocrlf true/false with Chrome at the path tests/lib/harness.mjs looks for.
# The suite also exercises the local collector end to end (tests/checks/89c-collector.mjs spawns it on 127.0.0.1).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # weekly, so a date-dependent check that goes red on a calendar boundary is noticed

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        autocrlf: ['true', 'false']
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf ${{ matrix.autocrlf }}

      - uses: actions/checkout@v4

      - name: Fixture line-ending guard
        run: |
          offenders="$(git ls-files --eol -- tests/fixtures | awk -F '\t' '$2 !~ /\.mjs$/ && $1 !~ /attr\/(-text|text eol=lf)[[:space:]]*$/')"
          if [ -n "$offenders" ]; then
            printf 'Fixtures need explicit -text or text eol=lf attributes:\n%s\n' "$offenders"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Build drift (AI Usage Dashboard.html == build of src/)
        run: node tools/build.mjs --check

      - name: Hygiene (no raw control bytes, size gate)
        run: |
          node -e "const b=require('fs').readFileSync('AI Usage Dashboard.html');let n=0;for(const x of b)if(x<9)n++;console.log('control bytes:',n,'bytes:',b.length);if(n||b.length>1024*1024)process.exit(1)"

      - name: Run the suite
        env:
          CHROME_PATH: C:/Program Files/Google/Chrome/Application/chrome.exe
        run: node tests/run.mjs

      - name: Upload screenshots and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.autocrlf }}
          path: |
            tests/artifacts/
            tests/fixtures/out/*.log
          if-no-files-found: ignore
